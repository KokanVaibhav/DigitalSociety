<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KV Digital Society</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">

    <style>
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; background-color: #ffffff; }
        
        /* नवीन आणि सुधारित नोटिफिकेशन बार */
        #notif-bar { 
            background: #2196F3; color: white; text-align: center; padding: 12px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; display: none; width: 100%; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); flex-shrink: 0; position: relative;
        }

        #notif-bar button.allow-btn { 
            margin-left: 10px; padding: 6px 15px; border-radius: 4px; border: none; 
            cursor: pointer; font-weight: bold; background: white; color: #2196F3; 
        }

        /* बार बंद करण्यासाठी छोटे 'X' बटन */
        .close-notif {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: white; font-size: 20px; cursor: pointer;
        }

        #app-iframe { flex-grow: 1; width: 100%; border: none; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>
</head>
<body>

<div id="notif-bar">
    🔔 सोसायटी अपडेट्स मिळवण्यासाठी <button class="allow-btn" onclick="askNotification()">Allow</button>
    <button class="close-notif" onclick="closeNotifBar()">×</button>
</div>
    
<iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbxz_apAe1hrJ4VZqi0u1uAdTTGnAPRZZ5POL4h7B8gUz8U4WcE9CX3c-027php-33Y50A/exec"></iframe> 

<script>
  // १. फायरबेस कॉन्फिग
  var firebaseConfig = {
    apiKey: "AIzaSyBfDsCvNBb6SVhz0Z8P5p3s5jIGVZQYTPc",
    authDomain: "kv-digital-society.firebaseapp.com",
    projectId: "kv-digital-society",
    storageBucket: "kv-digital-society.firebasestorage.app",
    messagingSenderId: "524643551701",
    appId: "1:524643551701:web:4f32cc6dc24b9bb48c155c"
  };

  firebase.initializeApp(firebaseConfig);
  const messaging = firebase.messaging();

  // २. सर्व चेक एकाच लोड फंक्शनमध्ये
  window.addEventListener('DOMContentLoaded', (event) => {
    const bar = document.getElementById('notif-bar');
    const urlParams = new URLSearchParams(window.location.search);

    // जर BridgePage कडून निरोप आला असेल
    if (urlParams.get('notif') === 'done') {
      localStorage.setItem("github_notif_status", "registered");
      // URL क्लिन करा
      const cleanURL = window.location.pathname;
      window.history.replaceState({}, '', cleanURL);
    }

    // बार दाखवायचा की नाही ते ठरवा
    const isRegistered = localStorage.getItem("github_notif_status") === "registered";
    const isUserHidden = localStorage.getItem("user_closed_notif") === "true";
    const isGranted = (Notification.permission === 'granted');

    if (!isRegistered && !isUserHidden && !isGranted) {
      bar.style.display = 'block';
    }
  });

  // बार तात्पुरता बंद करण्यासाठी
  function closeNotifBar() {
    document.getElementById('notif-bar').style.display = 'none';
    localStorage.setItem("user_closed_notif", "true"); // युजरने स्वतः बंद केल्याची नोंद
  }

  function askNotification() {
    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        const bar = document.getElementById('notif-bar');
        bar.innerHTML = "⏳ टोकन मिळवत आहे...";

        navigator.serviceWorker.register('firebase-messaging-sw.js')
        .then((reg) => navigator.serviceWorker.ready)
        .then((readyReg) => {
          return messaging.getToken({ 
            vapidKey: 'BG1NQMsKIT6Kf4zKRPazypj-q-CGL0XUqzVwDp6EGmsVxR5W7e1T91Bi3rRcbN8oGCUbcEJqpW23BSrOXJskOCQ', 
            serviceWorkerRegistration: readyReg 
          });
        })
        .then(fcmToken => {
          const scriptURL = "https://script.google.com/macros/s/AKfycbxz_apAe1hrJ4VZqi0u1uAdTTGnAPRZZ5POL4h7B8gUz8U4WcE9CX3c-027php-33Y50A/exec";
          const finalURL = scriptURL + "?action=registerFCM&fcmToken=" + fcmToken;
          document.getElementById('app-iframe').src = finalURL; 
          bar.style.display = 'none';
        })
        .catch(err => {
          bar.innerHTML = "⚠️ त्रुटी: " + err.message;
        });
      }
    });
  }

  // Logout मेसेज हाताळणे
  window.addEventListener("message", function(event) {
    if (event.data && event.data.type === 'SOCIETY_APP_LOGOUT') {
      localStorage.removeItem("github_notif_status");
      localStorage.removeItem("user_closed_notif");
      location.reload();
    }
  }, false);

</script>
</body>
</html>
